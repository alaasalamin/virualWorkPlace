<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs><clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath></defs>
  <g clip-path="url(#sq)">
  <!-- macOS squircle in the office's grass green -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#BFE0B0"/>
  <!-- sun -->
  <circle cx="760" cy="215" r="58" fill="#FFD23F"/>
  <!-- ground -->
  <rect x="100" y="700" width="824" height="224" fill="#A9D398"/>
  <!-- building: walls -->
  <rect x="270" y="380" width="484" height="360" fill="#B9D7E8"/>
  <!-- roof -->
  <rect x="236" y="330" width="552" height="70" fill="#7FA7C0"/>
  <rect x="300" y="270" width="424" height="70" fill="#7FA7C0"/>
  <!-- windows, lit -->
  <rect x="316" y="440" width="96" height="96" fill="#F2C879" stroke="#7FA7C0" stroke-width="12"/>
  <rect x="464" y="440" width="96" height="96" fill="#F2C879" stroke="#7FA7C0" stroke-width="12"/>
  <rect x="612" y="440" width="96" height="96" fill="#F2C879" stroke="#7FA7C0" stroke-width="12"/>
  <rect x="316" y="580" width="96" height="96" fill="#F2C879" stroke="#7FA7C0" stroke-width="12"/>
  <rect x="612" y="580" width="96" height="96" fill="#F2C879" stroke="#7FA7C0" stroke-width="12"/>
  <!-- door -->
  <rect x="464" y="580" width="96" height="160" fill="#2F5D62"/>
  <circle cx="540" cy="665" r="9" fill="#FFD23F"/>
  <!-- outline for crispness -->
  <rect x="270" y="380" width="484" height="360" fill="none" stroke="#1E2A3A" stroke-width="10"/>
  <rect x="236" y="330" width="552" height="70" fill="none" stroke="#1E2A3A" stroke-width="10"/>
  <rect x="300" y="270" width="424" height="70" fill="none" stroke="#1E2A3A" stroke-width="10"/>
  </g>
  <!-- squircle edge -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#1E2A3A" stroke-opacity="0.15" stroke-width="6"/>
</svg>
