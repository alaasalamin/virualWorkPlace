<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="viewport" id="viewport" aria-label="Office map. Drag or scroll to move around.">
    <div class="world" id="world"></div>
  </main>

  <header class="hud">
    <div class="hud-title">
      <h1>Agent Office</h1>
      <p id="team-count"></p>
    </div>
    <div class="hud-actions">
      <button class="btn waiting" id="waiting-btn" hidden></button>
      <button class="btn no" id="alerts-btn" aria-pressed="false">Turn on alerts</button>
    </div>
  </header>

  <nav class="map-tools" aria-label="Map">
    <div class="zoom-btns">
      <button class="icon-btn" id="zoom-out" aria-label="Zoom out">−</button>
      <button class="icon-btn" id="zoom-in" aria-label="Zoom in">+</button>
    </div>
    <canvas class="minimap" id="minimap" width="220" height="150" aria-label="Minimap. Click to jump there."></canvas>
  </nav>

  <div class="memos" id="memos" aria-live="polite"></div>
  <div class="hovercard" id="hovercard" hidden role="tooltip"></div>
  <div class="offline" id="offline" hidden>Can't reach the office server. Start it with <code>npm start</code> in agent-office. Retrying…</div>

  <dialog class="team-dialog" id="team-dialog">
    <form method="dialog" id="team-form">
      <h2 id="td-title">Build a new team</h2>
      <label>Team name
        <input name="name" required maxlength="40" autocomplete="off" placeholder="e.g. Mobile team">
      </label>
      <label class="new-only">Project
        <input name="project" maxlength="48" autocomplete="off" placeholder="e.g. coffee-app">
        <small>Folder in workplace/projects that the team works in.</small>
      </label>
      <label class="new-only">Orchestrator's name
        <input name="orchestratorName" maxlength="30" autocomplete="off">
      </label>
      <label class="new-only">Orchestrator's model
        <select name="model">
          <option value="fable">Fable (most capable, uses limits fastest)</option>
          <option value="opus">Opus</option>
          <option value="sonnet">Sonnet</option>
        </select>
      </label>
      <p class="form-error" id="td-error" hidden></p>
      <div class="actions">
        <button type="submit" class="btn go" id="td-submit">Build team</button>
        <button type="button" class="btn no" id="td-cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog class="board-dialog" id="board-dialog" aria-labelledby="board-title">
    <header class="dialog-head">
      <h2 id="board-title">Task board</h2>
      <button class="icon-btn" id="board-close" aria-label="Close board">✕</button>
    </header>
    <div class="board-cols" id="board-cols"></div>
  </dialog>

  <dialog class="preview-dialog" id="preview-dialog" aria-labelledby="pv-title">
    <header class="dialog-head">
      <h2 id="pv-title">Preview</h2>
      <form id="pv-form" class="pv-form">
        <input id="pv-url" aria-label="Address" spellcheck="false">
        <button class="btn no" type="submit">Go</button>
        <button class="btn no" type="button" id="pv-reload">Reload</button>
        <button class="link-btn" type="button" id="pv-reset">Back to project folder</button>
        <a class="link-btn" id="pv-open" target="_blank" rel="noopener">Open in a tab</a>
      </form>
      <button class="icon-btn" id="pv-close" aria-label="Close preview">✕</button>
    </header>
    <iframe id="pv-frame" title="Site preview" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
  </dialog>

  <aside class="panel" id="panel" hidden aria-label="Chat">
    <header class="panel-head">
      <div class="panel-portrait" id="p-portrait"></div>
      <div class="panel-who">
        <h2 id="p-name"></h2>
        <p id="p-role"></p>
        <p class="panel-meta"><span class="chip" id="p-team"></span><span class="chip" id="p-model"></span><span class="chip" id="p-project"></span><span class="usage" id="p-cost" title="Estimated API-equivalent cost of this agent's work. On a Max plan this comes out of your usage limits, not money."></span></p>
      </div>
      <button class="icon-btn" id="p-close" aria-label="Close chat">✕</button>
    </header>
    <details class="skills" id="p-skills" hidden>
      <summary id="p-skills-sum">Skills</summary>
      <div class="skill-list" id="p-skill-list"></div>
    </details>
    <div class="tabs" id="p-tabs" role="tablist" hidden>
      <button role="tab" id="tab-chat" aria-selected="true">Chat</button>
      <button role="tab" id="tab-work" aria-selected="false">Work</button>
    </div>
    <div class="work" id="work" hidden></div>
    <div class="log" id="log"></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="2" placeholder="Message…" aria-label="Message"></textarea>
      <div class="composer-row">
        <button type="button" class="link-btn danger" id="p-dismiss" hidden>Let go</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="p-stop" hidden>Stop</button>
        <button type="submit" class="btn">Send</button>
      </div>
    </form>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
